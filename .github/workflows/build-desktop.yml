name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

# Needed so the build can publish a GitHub Release (the auto-update feed).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      # Auto-incrementing version so every push becomes a newer release that
      # installed apps will pick up. github.run_number only ever increases.
      - name: Set version
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      # Build the Windows installer AND publish it to GitHub Releases
      # (installer + latest.yml). electron-updater reads this feed.
      - name: Build & publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      # Also keep the installer as a downloadable artifact for convenience.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EBG-Lake-House-Windows
          path: desktop/dist/*.exe
