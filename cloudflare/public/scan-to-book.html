<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBG Lake House — Scan to Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F0E8; --warm-white:#FDFAF5; --gold:#B8965A; --gold-dark:#8B6E3A;
    --charcoal:#2C2C2C; --medium-gray:#6B6B6B; --border:#D4C9B5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Jost','Helvetica Neue',sans-serif;
    background:var(--cream); color:var(--charcoal);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:40px 20px; -webkit-font-smoothing:antialiased;
  }
  .sign{
    background:var(--warm-white); border:1px solid var(--border);
    border-radius:22px; box-shadow:0 18px 50px rgba(44,44,44,.14);
    width:100%; max-width:520px; text-align:center; padding:54px 46px 46px;
  }
  .brand{font-family:'Cormorant Garamond',Georgia,serif; font-size:2.6rem; color:var(--gold); font-weight:600; line-height:1.05;}
  .brand span{display:block; font-size:1.05rem; letter-spacing:6px; text-transform:uppercase; color:var(--charcoal); font-family:'Jost',sans-serif; font-weight:400; margin-top:8px;}
  .rule{width:64px; height:2px; background:var(--gold); margin:22px auto 24px; border-radius:2px;}
  .headline{font-family:'Cormorant Garamond',serif; font-size:2rem; color:var(--charcoal); font-weight:600; margin-bottom:6px;}
  .sub{color:var(--medium-gray); font-size:1rem; margin-bottom:30px;}
  .qr-wrap{background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px; display:inline-block; box-shadow:0 6px 18px rgba(44,44,44,.06);}
  .qr-wrap svg{width:300px; height:300px; display:block;}
  .url{margin-top:26px; font-size:.95rem; color:var(--gold-dark); font-weight:500; word-break:break-all; letter-spacing:.3px;}
  .hint{margin-top:10px; font-size:.85rem; color:var(--medium-gray);}
  @media print{
    body{background:#fff; padding:0;}
    .sign{box-shadow:none; border:none; max-width:none;}
  }
</style>
</head>
