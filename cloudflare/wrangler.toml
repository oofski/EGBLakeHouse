name = "ebg-lakehouse"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# Bindings the Pages Functions expect: DB (D1 database) and FILES (R2 bucket).
# With this file present, Cloudflare manages bindings from here (not the dashboard).
[[d1_databases]]
binding = "DB"
database_name = "ebg-lakehouse"
database_id = "c2df4141-71f9-4f36-8ff0-1dcb54314e89"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ebg-lakehouse-files"
